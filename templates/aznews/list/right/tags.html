<aside class="single_sidebar_widget tag_cloud_widget">
  <h4 class="widget_title">Tag Clouds</h4>
  <ul class="list">
    {% for data in tags %}
    <li>
      <a href="{% url 'post-by-tag' data.id %}">{{ data }}</a>
    </li>
    {% empty %}
    <li><p>No tags available.</p></li>
    {% endfor %}
  </ul>
</aside>
