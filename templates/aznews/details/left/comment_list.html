{% load static %}
<div class="comments-area">
  <h4>{{ post.comment_set.count }} Comments</h4>

  {% for data in post.comment_set.all %}
    <div class="comment-list">
      <div class="single-comment justify-content-between d-flex">
        <div class="user justify-content-between d-flex">
          <div class="thumb">
            {% if post.author.userprofile.image %}
              <img src="{{ post.author.userprofile.image.url }}" alt="" />
            {% else %}
              <img src="{% static 'aznews/assets/img/comment/comment_1.png' %}" alt="" />
            {% endif %}
          </div>
          <div class="desc">
            <p class="comment">{{ data.comment }}</p>
            <div class="d-flex justify-content-between">
              <div class="d-flex align-items-center">
                <h5><a href="#">{{ data.name }}</a></h5>
                <p class="date">{{ data.created_at }}</p>
              </div>
              <div class="reply-btn">
                <a href="#" class="btn-reply text-uppercase">reply</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  {% endfor %}
</div>
