{% extends 'admindashboard/base.html' %} {% block content %}
<div class="min-h-screen flex items-center justify-center">
  <div
    class="w-full max-w-md p-10 bg-white rounded-3xl shadow-xl border border-gray-200"
  >
    <div class="text-center mb-8">
      <h2 class="text-4xl font-extrabold text-gray-800 mb-2">Welcome Back</h2>
      <p class="text-gray-500">Sign in to continue to your account</p>
    </div>
    <form method="POST" action="{% url 'login' %}" class="space-y-6">
      {% csrf_token %} {% if form.errors %}
      <div
        class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl"
      >
        Invalid username or password.
      </div>
      {% endif %}

      <div class="relative">
        <label for="username" class="block text-gray-700 font-medium mb-2"
          >Username</label
        >
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          class="w-full px-5 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition duration-300"
          required
        />
      </div>
      <div class="relative">
        <label for="password" class="block text-gray-700 font-medium mb-2"
          >Password</label
        >
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          class="w-full px-5 py-3 border border-gray-300 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition duration-300"
          required
        />
      </div>
      <div>
        <button
          type="submit"
          class="w-full py-3 bg-gradient-to-r from-blue-500 to-indigo-500 text-white font-semibold rounded-2xl hover:from-blue-600 hover:to-indigo-600 active:scale-95 transition duration-300 shadow-lg"
        >
          Login
        </button>
      </div>
    </form>
    <div class="text-center mt-6">
      <p class="text-gray-500">
        Don't have an account?
        <a
          href="{% url 'news_admin:userregister' %}"
          class="text-blue-600 hover:underline font-semibold"
          >Register</a
        >
      </p>
    </div>
  </div>
</div>
{% endblock %}
